<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Módulo de Gestión de ETLs - DATAX BOLIVIA Analyse 2.0</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <!-- Header Bar -->
    <header class="header-bar">
        <div class="header-content">
            <div class="header-left">
                <div class="logo-container">
                    <img src="images/logo_datax_bolivia.svg" alt="DATAX BOLIVIA" class="header-logo">
                    <span class="logo-subtitle">Analyze 2.0</span>
                </div>
                <nav class="header-nav">
                    <a href="index.html" class="active">Ejecución de ETLs</a>
                    <a id="schedulesNav" href="scheduler.html">Programación de ETLs</a>
                </nav>
            </div>
            <div class="header-right">
                <span class="user-greeting">Bienvenido, <strong id="userName">Usuario</strong></span>
                <button class="logout-btn" onclick="logoutAndRedirect()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Title -->
        <h1 class="page-title">Módulo de Gestión de ETLs</h1>
        <p class="page-subtitle">Administración y monitoreo de flujos de datos empresariales</p>

        <!-- ==================== DASHBOARD VIEW ==================== -->
        <div id="dashboardView">
            <!-- Database Selector Card -->
            <div class="card db-selector-card">
                <div class="db-selector-left">
                    <label for="baseDatosSelect" class="db-selector-label">Seleccionar Base de Datos</label>
                    <div class="db-select-wrapper">
                        <select id="baseDatosSelect" onchange="onBaseDatosSelected()">
                        </select>
                    </div>
                </div>
                <button id="refreshBtn" class="btn-refresh-datos" onclick="manualRefresh()" disabled>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    Refrescar
                </button>
            </div>

            <!-- Loading indicator -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando datos...</p>
            </div>

            <!-- Error message -->
            <div id="errorMessage" class="error-message"></div>

            <!-- Dual Panel: Table + Status -->
            <div id="tableContainer" class="dual-panel" style="display: none;">
                <!-- Left Panel - Main Table -->
                <div class="panel-left">
                    <div class="panel-card">
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Tipo Entidad</th>
                                        <th>Cod Envío</th>
                                        <th>Fecha</th>
                                        <th class="center-header">Acciones</th>
                                        <th class="separator"></th>
                                        <th>Estado Actual</th>
                                        <th>Modo Ejecución</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        // ========================
        //  Global state
        // ========================
        let currentCodigo = "";
        let currentIsDayBased = false;
        let batchPollingInterval = null; // Single interval for batch polling all active executions
        let pollingState = {}; // Maps historyId -> { codEnvio, fechadatos } for restart after refresh
        let tableRefreshInProgress = false;

        // ========================
        //  Stop batch polling interval
        // ========================
        function stopAllPolling() {
            if (batchPollingInterval) {
                clearInterval(batchPollingInterval);
                batchPollingInterval = null;
            }
        }

        // ========================
        //  Manual refresh - full table re-render
        //  Uses refreshInProgress flag to prevent race conditions with polling.
        // ========================
        async function manualRefresh() {
            if (!currentCodigo) return;

            const refreshBtn = document.getElementById("refreshBtn");
            refreshBtn.disabled = true;
            refreshBtn.classList.add("spinning");

            const loading = document.getElementById("loading");
            const tableContainer = document.getElementById("tableContainer");
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.textContent = "";
            loading.classList.add("visible");
            tableContainer.style.display = "none";

            // Set flag to block polling from firing concurrently
            tableRefreshInProgress = true;

            // Save active polling state before clearing interval
            // so we can restart polling for in-progress items after refresh
            const savedPollingState = { ...pollingState };

            // Clear existing batch polling interval to prevent stale callbacks
            // from interfering with the freshly rendered table DOM
            stopAllPolling();

            try {
                const res = await authenticatedFetch(`${API_BASE}/api/etlexecutor/query-results?codigo=${encodeURIComponent(currentCodigo)}`);

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                // Full re-render (not partial update)
                renderResultsTable(data);
                tableContainer.style.display = "block";

                // Restart batch polling if any items were still in progress
                if (Object.keys(savedPollingState).length > 0) {
                    startBatchPolling();
                }
            } catch (error) {
                errorMessage.textContent = `Error refrescando datos: ${error.message}`;
            } finally {
                loading.classList.remove("visible");
                refreshBtn.disabled = false;
                refreshBtn.classList.remove("spinning");
                // Release the flag so polling can resume
                tableRefreshInProgress = false;
            }
        }

        // ========================
        //  Check if the month following fecha has already concluded.
        //  The "Actualizar" button is only shown when current month is at
        //  least 2 months ahead of fecha's month (i.e., the next month
        //  after fecha has fully passed).
        // ========================
        function isCurrentYearMonthGreaterThanFecha(fechaValue) {
            if (!fechaValue) return false;

            // Parse the fecha to extract year and month.
            // DateOnly values come as "YYYY-MM-DD" strings.
            const dateOnlyMatch = String(fechaValue).match(/^(\d{4})-(\d{2})/);
            if (dateOnlyMatch) {
                const fechaYear = parseInt(dateOnlyMatch[1], 10);
                const fechaMonth = parseInt(dateOnlyMatch[2], 10);
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1; // getMonth() is 0-based
                // Compare as year-month integers to handle cross-year comparisons.
                // Require currentYM >= fechaYM + 2 so that the month following
                // fecha has already concluded (not just started).
                const currentYM = currentYear * 12 + currentMonth;
                const fechaYM = fechaYear * 12 + fechaMonth;
                return currentYM >= fechaYM + 2;
            }

            // Fallback: try parsing as full datetime
            const d = new Date(fechaValue);
            if (isNaN(d.getTime())) return false;
            const fechaYear = d.getFullYear();
            const fechaMonth = d.getMonth() + 1;
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentYM = currentYear * 12 + currentMonth;
            const fechaYM = fechaYear * 12 + fechaMonth;
            return currentYM >= fechaYM + 2;
        }

        // ========================
        //  Check if the day following fecha has already concluded.
        //  The "Actualizar" button is only shown when current date is at
        //  least 2 days ahead of fecha's date (i.e., the next day after
        //  fecha has fully passed).
        // ========================
        function isCurrentDateGreaterThanFecha(fechaValue) {
            if (!fechaValue) return false;

            const dateOnlyMatch = String(fechaValue).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (dateOnlyMatch) {
                const fechaDate = new Date(parseInt(dateOnlyMatch[1]), parseInt(dateOnlyMatch[2]) - 1, parseInt(dateOnlyMatch[3]));
                fechaDate.setDate(fechaDate.getDate() + 1); // Next day must have concluded
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return now > fechaDate;
            }

            const d = new Date(fechaValue);
            if (isNaN(d.getTime())) return false;
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 1); // Next day must have concluded
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return now > d;
        }

        // ========================
        //  Spanish month names
        // ========================
        const spanishMonths = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        // ========================
        //  Parse year and month from a date string
        //  Supports "YYYY-MM-DD", "YYYY/MM/DD", or full datetime strings.
        //  Returns { year, month } or null on failure.
        // ========================
        function parseYearMonth(fechaValue) {
            if (!fechaValue) return null;

            const dateOnlyMatch = String(fechaValue).match(/^(\d{4})[-/](\d{2})/);
            if (dateOnlyMatch) {
                return {
                    year: parseInt(dateOnlyMatch[1], 10),
                    month: parseInt(dateOnlyMatch[2], 10)
                };
            }

            const d = new Date(fechaValue);
            if (isNaN(d.getTime())) return null;
            return { year: d.getFullYear(), month: d.getMonth() + 1 };
        }

        // ========================
        //  Parse full date (year, month, day) from a date string
        //  Supports "YYYY-MM-DD", "YYYY/MM/DD", or full datetime strings.
        //  Returns { year, month, day } or null on failure.
        // ========================
        function parseFullDate(fechaValue) {
            if (!fechaValue) return null;

            const dateOnlyMatch = String(fechaValue).match(/^(\d{4})[-/](\d{2})[-/](\d{2})/);
            if (dateOnlyMatch) {
                return {
                    year: parseInt(dateOnlyMatch[1], 10),
                    month: parseInt(dateOnlyMatch[2], 10),
                    day: parseInt(dateOnlyMatch[3], 10)
                };
            }

            const d = new Date(fechaValue);
            if (isNaN(d.getTime())) return null;
            return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
        }

        // ========================
        //  Get the next month number (1-12), wrapping December -> January
        // ========================
        function getNextMonth(month) {
            return month % 12 + 1;
        }

        // ========================
        //  Build "Actualizar [MES]" label from fecha (month-based codes)
        // ========================
        function getActualizarLabel(fechaValue) {
            const parsed = parseYearMonth(fechaValue);
            if (!parsed) return "Actualizar";

            const nextMonth = getNextMonth(parsed.month);
            const monthName = spanishMonths[nextMonth - 1];

            return `Actualizar ${monthName}`;
        }

        // ========================
        //  Build "Actualizar [DIA] de <Month>" label for day-based codes
        // ========================
        function getActualizarLabelDayBased(fechaValue) {
            const parsed = parseFullDate(fechaValue);
            if (!parsed) return "Actualizar";

            // Next day
            const nextDate = new Date(parsed.year, parsed.month - 1, parsed.day + 1);
            const nextDay = nextDate.getDate();
            const nextMonth = nextDate.getMonth() + 1;
            const monthName = spanishMonths[nextMonth - 1];

            return `Actualizar ${nextDay} de ${monthName}`;
        }

        // ========================
        //  Build "Reprocesar [MES]" label from fecha (month-based codes)
        // ========================
        function getReprocesarLabel(fechaValue) {
            const parsed = parseYearMonth(fechaValue);
            if (!parsed) return "Reprocesar";

            const monthName = spanishMonths[parsed.month - 1];

            return `Reprocesar ${monthName}`;
        }

        // ========================
        //  Build "Reprocesar [DIA] de <Month>" label for day-based codes
        // ========================
        function getReprocesarLabelDayBased(fechaValue) {
            const parsed = parseFullDate(fechaValue);
            if (!parsed) return "Reprocesar";

            const monthName = spanishMonths[parsed.month - 1];

            return `Reprocesar ${parsed.day} de ${monthName}`;
        }

        // ========================
        //  Format date as YYYY/MM/DD
        // ========================
        function formatDateYYYYMMDD(dateValue) {
            if (!dateValue) return "-";

            // DateOnly values are serialized as "YYYY-MM-DD" strings.
            // Passing them to new Date() interprets them as UTC midnight,
            // which shifts the date back by one day in UTC-4 timezone.
            // Parse date-only strings directly to avoid timezone conversion.
            const dateOnlyMatch = String(dateValue).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (dateOnlyMatch) {
                return `${dateOnlyMatch[1]}/${dateOnlyMatch[2]}/${dateOnlyMatch[3]}`;
            }

            // Full datetime strings (e.g., UltimaFechaEjecucion) should be
            // converted to local time before extracting the date components.
            const d = new Date(dateValue);
            if (isNaN(d.getTime())) return "-";
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${year}/${month}/${day}`;
        }

        // ========================
        //  Load base_datos on page load
        // ========================
        async function loadBaseDatos() {
            try {
                const res = await authenticatedFetch(`${API_BASE}/api/etlexecutor/base-datos`);

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                const select = document.getElementById("baseDatosSelect");

                if (!data || data.length === 0) {
                    console.warn("No base_datos records returned from API.");
                    return;
                }

                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.codigo;
                    option.textContent = `${item.codigo} - ${item.nombre}`;
                    option.dataset.isDayBased = item.isDayBased || "false";
                    select.appendChild(option);
                });

                // Auto-select the first item and load its query results
                select.selectedIndex = 0;
                await onBaseDatosSelected();
            } catch (error) {
                console.error("Error loading base_datos:", error);
            }
        }

        // ========================
        //  When user selects a base de datos
        // ========================
        async function onBaseDatosSelected() {
            const select = document.getElementById("baseDatosSelect");
            const codigo = select.value;
            const loading = document.getElementById("loading");
            const tableContainer = document.getElementById("tableContainer");
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.textContent = "";

            if (!codigo) {
                tableContainer.style.display = "none";
                document.getElementById("refreshBtn").disabled = true;
                return;
            }

            currentCodigo = codigo;
            currentIsDayBased = select.selectedOptions[0]?.dataset?.isDayBased === "true";
            loading.classList.add("visible");
            tableContainer.style.display = "none";

            try {
                const res = await authenticatedFetch(`${API_BASE}/api/etlexecutor/query-results?codigo=${encodeURIComponent(codigo)}`);

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                renderResultsTable(data);
                tableContainer.style.display = "block";
            } catch (error) {
                errorMessage.textContent = `Error cargando resultados: ${error.message}`;
            } finally {
                loading.classList.remove("visible");
                document.getElementById("refreshBtn").disabled = false;
            }
        }

        // ========================
        //  Render results table
        // ========================
        function renderResultsTable(results) {
            const tbody = document.getElementById("resultsBody");
            tbody.innerHTML = "";

            if (!results || results.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Sin resultados</td></tr>";
                return;
            }

            results.forEach(row => {
                const tr = document.createElement("tr");

                // Determine if this row has an active execution (PENDIENTE or EN PROCESO)
                const isActiveExecution = row.estadoEjecucion === "PENDIENTE" || row.estadoEjecucion === "EN PROCESO";

                const tipoEntidad = document.createElement("td");
                tipoEntidad.textContent = row.tipoEntidad || "-";
                tr.appendChild(tipoEntidad);

                const codEnvio = document.createElement("td");
                codEnvio.textContent = row.codEnvio || "-";
                tr.appendChild(codEnvio);

                const fechadatos = document.createElement("td");
                fechadatos.id = `fecha-${row.codEnvio}`;
                fechadatos.textContent = row.fechadatos ? formatDateYYYYMMDD(row.fechadatos) : "-";
                tr.appendChild(fechadatos);

                // Actions cell (position 4 - before status columns)
                const actionsCell = document.createElement("td");
                const actionWrapper = document.createElement("div");
                actionWrapper.className = "action-buttons";

                const canActualizar = currentIsDayBased
                    ? isCurrentDateGreaterThanFecha(row.fechadatos)
                    : isCurrentYearMonthGreaterThanFecha(row.fechadatos);

                if (canActualizar) {
                    const actualizarBtn = document.createElement("button");
                    actualizarBtn.className = "btn btn-actualizar";
                    actualizarBtn.textContent = currentIsDayBased
                        ? getActualizarLabelDayBased(row.fechadatos)
                        : getActualizarLabel(row.fechadatos);
                    actualizarBtn.onclick = () => executeAction("Actualizar", row);
                    if (isActiveExecution) {
                        actualizarBtn.disabled = true;
                        actualizarBtn.title = row.estadoEjecucion === "PENDIENTE"
                            ? "Ejecución pendiente. Espere a que concluya."
                            : "Ejecución en proceso. Espere a que concluya.";
                    }
                    actionWrapper.appendChild(actualizarBtn);
                }

                const repDocBtn = document.createElement("button");
                repDocBtn.className = "btn btn-reprocesar";
                repDocBtn.textContent = currentIsDayBased
                    ? getReprocesarLabelDayBased(row.fechadatos)
                    : getReprocesarLabel(row.fechadatos);
                repDocBtn.onclick = () => executeAction("Reprocesar", row);
                if (isActiveExecution) {
                    repDocBtn.disabled = true;
                    repDocBtn.title = row.estadoEjecucion === "PENDIENTE"
                        ? "Ejecución pendiente. Espere a que concluya."
                        : "Ejecución en proceso. Espere a que concluya.";
                }
                actionWrapper.appendChild(repDocBtn);

                actionsCell.appendChild(actionWrapper);
                tr.appendChild(actionsCell);

                // Separator column - empty gap between data and status sections
                const separatorCell = document.createElement("td");
                separatorCell.className = "separator";
                tr.appendChild(separatorCell);

                // Status cell - show execution status from query results (position 6 - status section)
                const statusCell = document.createElement("td");
                const statusSpan = document.createElement("span");
                statusSpan.id = `status-${row.codEnvio}`;
                statusSpan.className = "status-badge";
                // Text node for status label
                const statusText = document.createElement("span");
                statusText.id = `statusText-${row.codEnvio}`;
                statusText.className = "status-text";
                statusText.textContent = row.estadoEjecucion || "-";
                statusSpan.appendChild(statusText);
                // Tooltip container (hidden by default)
                const tooltipEl = document.createElement("div");
                tooltipEl.className = "status-tooltip";
                tooltipEl.id = `tooltip-${row.codEnvio}`;
                // Build tooltip content: use Output/Error for terminal states, fallback to last execution date
                let tooltipContent = "";
                if (row.estadoEjecucion === "EXITOSO" && row.output) {
                    tooltipContent = row.output;
                } else if (row.estadoEjecucion === "FALLIDO" && row.error) {
                    tooltipContent = row.error;
                } else if (row.ultimaFechaEjecucion) {
                    tooltipContent = `Última ejecución: ${formatDateYYYYMMDD(row.ultimaFechaEjecucion)}`;
                }
                if (tooltipContent) {
                    tooltipEl.textContent = tooltipContent;
                    statusSpan.classList.add("has-tooltip");
                }
                statusSpan.appendChild(tooltipEl);

                // Hover events for tooltip positioning
                statusSpan.addEventListener("mouseenter", function () {
                    if (this.classList.contains("has-tooltip")) {
                        positionTooltip(tooltipEl, this);
                        tooltipEl.classList.add("visible");
                    }
                });
                statusSpan.addEventListener("mouseleave", function () {
                    tooltipEl.classList.remove("visible");
                });

                // Apply status class based on estadoEjecucion
                if (row.estadoEjecucion) {
                    const statusClass = getStatusClass(row.estadoEjecucion);
                    statusSpan.classList.add(statusClass);
                }

                statusCell.appendChild(statusSpan);
                tr.appendChild(statusCell);

                // TriggerType cell (position 6 - status section)
                const triggerTypeCell = document.createElement("td");
                triggerTypeCell.id = `triggerType-${row.codEnvio}`;
                triggerTypeCell.textContent = row.triggerType || "-";
                tr.appendChild(triggerTypeCell);

                // Apply visual indicator for active executions
                if (isActiveExecution) {
                    tr.classList.add("row-active-execution");
                }

                tbody.appendChild(tr);
            });
        }

        // ========================
        //  Execute action (Actualizar/Reprocesar)
        // ========================
        async function executeAction(action, row) {
            const codEnvio = row.codEnvio;

            try {
                const res = await authenticatedFetch(`${API_BASE}/api/etlexecutor/execute`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action: action,
                        tipoEntidad: row.tipoEntidad,
                        codEnvio: row.codEnvio,
                        fechaDatos: row.fechadatos,
                        codigo: currentCodigo,
                        isDayBased: currentIsDayBased
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                showToast(`Comando encolado. HistoryId: ${data.historyId}`, "success");

                // Register this historyId for batch polling and start the batch interval if not running
                pollingState[data.historyId] = { codEnvio, fechadatos: row.fechadatos };
                startBatchPolling();

            } catch (error) {
                showToast(`Error: ${error.message}`, "error");
            }
        }

        // ========================
        //  Batch polling for all active ETLExecutionHistory records
        //  Makes a single request per interval to reduce database load
        // ========================
        function startBatchPolling() {
            if (batchPollingInterval) return; // Already running

            batchPollingInterval = setInterval(async () => {
                // Guard: skip this cycle if manual refresh is in progress
                if (tableRefreshInProgress) return;

                try {
                    const res = await authenticatedFetch(`${API_BASE}/api/etlexecutor/status/active`);

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const items = await res.json();

                    // Build a set of active historyIds from the response
                    const activeHistoryIds = new Set(items.map(item => item.id));

                    // Track which historyIds we were polling that are no longer active
                    const previouslyPolledIds = new Set(Object.keys(pollingState));

                    for (const item of items) {
                        const codEnvio = item.codEnvio;

                        // Determine tooltip content for terminal states
                        let tooltipContent = "";
                        if (item.status === "EXITOSO" && item.output) {
                            tooltipContent = item.output;
                        } else if (item.status === "FALLIDO" && item.error) {
                            tooltipContent = item.error;
                        }

                        updateStatusBadge(codEnvio, item.status, tooltipContent);
                        updateFechaCell(codEnvio, item.fechaDatos);
                        updateTriggerType(codEnvio, item.triggerType);

                        // Update action buttons if fechaDatos changed
                        const prevState = pollingState[item.id];
                        if (prevState && item.fechaDatos && item.fechaDatos !== prevState.fechadatos) {
                            pollingState[item.id] = { codEnvio, fechadatos: item.fechaDatos };
                            updateActionButtons(codEnvio, item.fechaDatos);
                        }

                        // Stop polling for this historyId when terminal status reached
                        if (item.status === "EXITOSO" || item.status === "FALLIDO") {
                            delete pollingState[item.id];

                            if (item.status === "EXITOSO") {
                                showToast("Ejecución completada con éxito.", "success");
                            } else {
                                showToast(`Ejecución fallida. Error: ${item.error || "Desconocido"}`, "error");
                            }
                        }
                    }

                    // Clean up polling state for historyIds no longer in active response
                    // (they may have reached terminal state between polling cycles)
                    // Fetch individual status to update UI before removing from polling state
                    for (const historyId of previouslyPolledIds) {
                        if (!activeHistoryIds.has(historyId)) {
                            try {
                                const statusRes = await authenticatedFetch(`${API_BASE}/api/etlexecutor/status/${historyId}`);
                                if (statusRes.ok) {
                                    const finalItem = await statusRes.json();
                                    const codEnvio = finalItem.codEnvio;

                                    // Determine tooltip content for terminal states
                                    let tooltipContent = "";
                                    if (finalItem.status === "EXITOSO" && finalItem.output) {
                                        tooltipContent = finalItem.output;
                                    } else if (finalItem.status === "FALLIDO" && finalItem.error) {
                                        tooltipContent = finalItem.error;
                                    }

                                    updateStatusBadge(codEnvio, finalItem.status, tooltipContent);
                                    updateFechaCell(codEnvio, finalItem.fechaDatos);
                                    updateTriggerType(codEnvio, finalItem.triggerType);

                                    const prevState = pollingState[historyId];
                                    if (prevState && finalItem.fechaDatos && finalItem.fechaDatos !== prevState.fechadatos) {
                                        pollingState[historyId] = { codEnvio, fechadatos: finalItem.fechaDatos };
                                        updateActionButtons(codEnvio, finalItem.fechaDatos);
                                    }

                                    if (finalItem.status === "EXITOSO") {
                                        showToast("Ejecución completada con éxito.", "success");
                                    } else if (finalItem.status === "FALLIDO") {
                                        showToast(`Ejecución fallida. Error: ${finalItem.error || "Desconocido"}`, "error");
                                    }
                                }
                            } catch (error) {
                                console.error("Failed to fetch final status for", historyId, error);
                            }
                            delete pollingState[historyId];
                        }
                    }

                    // Stop batch polling if no more items being tracked
                    if (Object.keys(pollingState).length === 0) {
                        stopAllPolling();
                    }
                } catch (error) {
                    console.error("Batch polling error:", error);
                }
            }, 5000);
        }

        // ========================
        //  Update Fecha cell in table
        // ========================
        function updateFechaCell(codEnvio, fechaDatos) {
            const fechaEl = document.getElementById(`fecha-${codEnvio}`);
            if (!fechaEl) return;
            fechaEl.textContent = fechaDatos ? formatDateYYYYMMDD(fechaDatos) : "-";
        }

        // ========================
        //  Update action buttons in table row when fechaDatos changes
        // ========================
        function updateActionButtons(codEnvio, newFechaDatos) {
            const fechaEl = document.getElementById(`fecha-${codEnvio}`);
            if (!fechaEl) return;

            // Traverse up to the <tr> row, then find the .action-buttons container
            const row = fechaEl.closest("tr");
            if (!row) return;

            // Extract TipoEntidad from the first <td> of the row so it is preserved
            // when click handlers are rebuilt below.
            const tipoEntidad = row.cells[0]?.textContent || "";

            const actionWrapper = row.querySelector(".action-buttons");
            if (!actionWrapper) return;

            // Determine if Actualizar is eligible for the new date
            const canActualizar = currentIsDayBased
                ? isCurrentDateGreaterThanFecha(newFechaDatos)
                : isCurrentYearMonthGreaterThanFecha(newFechaDatos);

            // Get existing Actualizar button (first button in wrapper)
            const existingActualizarBtn = actionWrapper.querySelector(".btn-actualizar");
            const existingReprocesarBtn = actionWrapper.querySelector(".btn-reprocesar");

            if (canActualizar) {
                if (existingActualizarBtn) {
                    // Update the label
                    existingActualizarBtn.textContent = currentIsDayBased
                        ? getActualizarLabelDayBased(newFechaDatos)
                        : getActualizarLabel(newFechaDatos);
                    // Update the click handler to use the new fecha
                    const rowData = { codEnvio, tipoEntidad, fechadatos: newFechaDatos };
                    existingActualizarBtn.onclick = () => executeAction("Actualizar", rowData);
                } else {
                    // Create the Actualizar button (it wasn't shown before)
                    const actualizarBtn = document.createElement("button");
                    actualizarBtn.className = "btn btn-actualizar";
                    actualizarBtn.textContent = currentIsDayBased
                        ? getActualizarLabelDayBased(newFechaDatos)
                        : getActualizarLabel(newFechaDatos);
                    // Store the row data for the click handler
                    const rowData = { codEnvio, tipoEntidad, fechadatos: newFechaDatos };
                    actualizarBtn.onclick = () => executeAction("Actualizar", rowData);
                    // Insert before the Reprocesar button
                    if (existingReprocesarBtn) {
                        actionWrapper.insertBefore(actualizarBtn, existingReprocesarBtn);
                    } else {
                        actionWrapper.appendChild(actualizarBtn);
                    }
                }
            } else {
                // Remove Actualizar button if it exists and is no longer eligible
                if (existingActualizarBtn) {
                    existingActualizarBtn.remove();
                }
            }

            // Always update the Reprocesar button label
            if (existingReprocesarBtn) {
                existingReprocesarBtn.textContent = currentIsDayBased
                    ? getReprocesarLabelDayBased(newFechaDatos)
                    : getReprocesarLabel(newFechaDatos);
                // Update the click handler to use the new fecha
                const rowData = { codEnvio, tipoEntidad, fechadatos: newFechaDatos };
                existingReprocesarBtn.onclick = () => executeAction("Reprocesar", rowData);
            }

            // Preserve disabled state based on current execution status
            const statusTextEl = document.getElementById(`statusText-${codEnvio}`);
            if (statusTextEl) {
                updateRowVisualState(codEnvio, statusTextEl.textContent);
            }
        }

        // ========================
        //  Update TriggerType cell in table
        // ========================
        function updateTriggerType(codEnvio, triggerType) {
            const triggerTypeEl = document.getElementById(`triggerType-${codEnvio}`);
            if (!triggerTypeEl) return;
            triggerTypeEl.textContent = triggerType || "-";
        }

        // ========================
        //  Position tooltip above the badge using fixed positioning
        // ========================
        function positionTooltip(tooltipEl, badgeEl) {
            const rect = badgeEl.getBoundingClientRect();
            // Temporarily add visible class to measure actual dimensions
            tooltipEl.classList.add("visible");
            const tooltipHeight = tooltipEl.offsetHeight;
            const tooltipWidth = tooltipEl.offsetWidth;
            tooltipEl.style.top = (rect.top - tooltipHeight - 10) + "px";
            tooltipEl.style.left = (rect.left + rect.width / 2 - tooltipWidth / 2) + "px";
        }

        // ========================
        //  Map Spanish status to CSS class
        // ========================
        function getStatusClass(status) {
            switch (status) {
                case "PENDIENTE": return "status-pending";
                case "EN PROCESO": return "status-running";
                case "EXITOSO": return "status-success";
                case "FALLIDO": return "status-failed";
                default: return "status-pending";
            }
        }

        // ========================
        //  Update row visual state (disable buttons + dim row) based on status
        // ========================
        function updateRowVisualState(codEnvio, status) {
            const statusEl = document.getElementById(`status-${codEnvio}`);
            if (!statusEl) return;

            const row = statusEl.closest("tr");
            if (!row) return;

            const actionWrapper = row.querySelector(".action-buttons");
            const isActive = status === "PENDIENTE" || status === "EN PROCESO";

            if (actionWrapper) {
                const buttons = actionWrapper.querySelectorAll("button");
                buttons.forEach(btn => {
                    btn.disabled = isActive;
                    if (isActive) {
                        btn.title = status === "PENDIENTE"
                            ? "Ejecución pendiente. Espere a que concluya."
                            : "Ejecución en proceso. Espere a que concluya.";
                    } else {
                        btn.title = "";
                    }
                });
            }

            if (isActive) {
                row.classList.add("row-active-execution");
            } else {
                row.classList.remove("row-active-execution");
            }
        }

        // ========================
        //  Update status badge in table
        // ========================
        function updateStatusBadge(codEnvio, status, tooltipContent) {
            const statusEl = document.getElementById(`status-${codEnvio}`);
            if (!statusEl) return;

            // Update only the status text, preserving the tooltip child
            const statusTextEl = document.getElementById(`statusText-${codEnvio}`);
            if (statusTextEl) {
                statusTextEl.textContent = status;
            }

            statusEl.className = "status-badge";

            switch (status) {
                case "PENDIENTE":
                    statusEl.classList.add("status-pending");
                    break;
                case "EN PROCESO":
                    statusEl.classList.add("status-running");
                    break;
                case "EXITOSO":
                    statusEl.classList.add("status-success");
                    break;
                case "FALLIDO":
                    statusEl.classList.add("status-failed");
                    break;
                default:
                    statusEl.classList.add("status-pending");
            }

            // Set or clear tooltip content
            const tooltipEl = document.getElementById(`tooltip-${codEnvio}`);
            if (tooltipEl && tooltipContent) {
                tooltipEl.textContent = tooltipContent;
                statusEl.classList.add("has-tooltip");
            } else if (tooltipEl) {
                tooltipEl.textContent = "";
                statusEl.classList.remove("has-tooltip");
            }

            // Update row visual state (disable buttons + dim row) based on new status
            updateRowVisualState(codEnvio, status);
        }


        // ========================
        //  Toast notification
        // ========================
        function showToast(message, type) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "toast visible";

            if (type === "success") {
                toast.classList.add("toast-success");
            } else {
                toast.classList.add("toast-error");
            }

            setTimeout(() => {
                toast.classList.remove("visible");
            }, 4000);
        }

        // ========================
        //  On page load: check if authenticated
        // ========================
        (async function init() {
            const authenticated = await ensureAuthenticated();
            if (authenticated) {
                // Get firstname from localStorage
                const firstname = getFirstname();
                document.getElementById("userName").textContent = firstname || "Usuario";

                // Hide scheduler nav link for non-admin users
                if (!isAdmin()) {
                    const schedulesNav = document.getElementById("schedulesNav");
                    if (schedulesNav) schedulesNav.style.display = "none";
                }

                loadBaseDatos();
                // Schedule auto-refresh for while page is open
                scheduleAutoRefresh();
                renderFooter();
            } else {
                clearTokens();
                window.location.href = "login.html";
            }
        })();

        // ========================
        //  SignalR - Real-time scheduled task notifications
        // ========================
        function connectToNotificationHub() {
            const connection = new signalR.HubConnectionBuilder()
                .withUrl("/etlNotifications")
                .withAutomaticReconnect()
                .build();

            connection.on("TaskStarted", (params) => {
                const shortParams = params ? params.substring(0, 80) + (params.length > 80 ? "..." : "") : "";
                showScheduledToast(`⏱️  Tarea programada iniciada${shortParams ? ': ' + shortParams : ''}`, "info");
            });

            connection.on("TaskCompleted", (success, params) => {
                const shortParams = params ? params.substring(0, 80) + (params.length > 80 ? "..." : "") : "";
                if (success) {
                    showScheduledToast(`✅ Tarea programada completada exitosamente${shortParams ? ': ' + shortParams : ''}`, "success");
                } else {
                    showScheduledToast(`❌ Tarea programada fallida${shortParams ? ': ' + shortParams : ''}`, "error");
                }
            });

            connection.start().catch(err => console.error("SignalR connection failed:", err));
        }

        function showScheduledToast(message, type) {
            const toast = document.getElementById("scheduledToast");
            if (!toast) return;
            toast.textContent = message;
            toast.className = "scheduled-toast visible";
            if (type === "success") toast.classList.add("scheduled-toast-success");
            else if (type === "error") toast.classList.add("scheduled-toast-error");
            else toast.classList.add("scheduled-toast-info");

            clearTimeout(window._scheduledToastTimeout);
            window._scheduledToastTimeout = setTimeout(() => {
                toast.classList.remove("visible");
            }, 3000);
        }

        // Connect to SignalR hub after authentication
        const scheduledToastObserver = new MutationObserver(() => {
            if (document.getElementById("scheduledToast")) {
                connectToNotificationHub();
                scheduledToastObserver.disconnect();
            }
        });
        // Try connecting immediately if element exists, otherwise wait
        if (document.getElementById("scheduledToast")) {
            connectToNotificationHub();
        } else {
            scheduledToastObserver.observe(document.body, { childList: true, subtree: true });
        }
    </script>

    <!-- Scheduled task toast notification -->
    <div id="scheduledToast" class="scheduled-toast"></div>
</body>

</html>
