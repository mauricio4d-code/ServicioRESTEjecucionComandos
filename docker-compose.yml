version: "3.8"

services:
  servicio-rest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicio-rest-ejecucion
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      # Override connection strings as needed for your environment:
      # - ConnectionStrings__AuthDatabase=Data Source=/data/auth/analyze.db3
      # - ConnectionStrings__ServiceDatabase=Host=postgres;Database=asfiws;Username=postgres;Password=yourpassword
    volumes:
      - sqlite-data:/app          # Persist ServicioRESTEjecucionComandos.db
      - logs-data:/app/Logs       # Persist Serilog logs
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    depends_on:
      servicio-rest:
        condition: service_started
    networks:
      - monitoring

volumes:
  sqlite-data:
    driver: local
  logs-data:
    driver: local
  uptime-kuma-data:
    driver: local

networks:
  monitoring:
    driver: bridge
